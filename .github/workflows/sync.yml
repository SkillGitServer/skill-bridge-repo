name: Sync to Render Deployment Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Destination Repository
        run: |
          git config --global user.name "SkillGitServer"
          git config --global user.email "dev@skillbridge.in"
          git remote add destination "https://x-access-token:${{ secrets.RENDER_REPO_PAT }}@github.com/SkillGitServer/skill-bridge-repo.git"
          git push destination main --force
