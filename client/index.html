  <!-- Dynamic PWA Manifest & Icon Loader -->
  <script>
    (function () {
      // Global listener to capture PWA install prompt early
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      var p = window.location.pathname;
      var m = null;
      var icon = '/logo.png';
      if (p.indexOf('/admin') === 0 || p.indexOf('/download/vault') === 0 || p.indexOf('/download/admin') === 0) {
        m = '/manifest-admin.json';
        icon = '/adm-icon.png';
      } else if (p.indexOf('/sudo-control-panel') === 0 || p.indexOf('/super-admin') === 0 || p.indexOf('/super_admin') === 0 || p.indexOf('/download/supss') === 0 || p.indexOf('/download/super-admin') === 0) {
        m = '/manifest-superadmin.json';
        icon = '/sup-icon.png';
      } else if (p.indexOf('/student') === 0 || p.indexOf('/register') === 0 || p.indexOf('/login') === 0 || p.indexOf('/dashboard') === 0 || p.indexOf('/download') === 0) {
        m = '/manifest-student.json';
        icon = '/stu-icon.png';
      }

      if (m) {
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = m;
        l.id = 'pwa-manifest-link';
        document.head.appendChild(l);
      }

      var fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/png';
      fav.href = icon;
      fav.id = 'pwa-favicon-link';
      document.head.appendChild(fav);

      var touch = document.createElement('link');
      touch.rel = 'apple-touch-icon';
      touch.href = icon;
      touch.id = 'pwa-apple-touch-link';
      document.head.appendChild(touch);
    })();
  </script>

    // Pre-flight cleanup: if user explicitly selected English, ensure no rogue googtrans cookies persist
    (function () {
      try {
        if (localStorage.getItem('preferred_language') === 'en') {
          var host = window.location.hostname;
          var hostParts = host.split('.');
          var domains = ['', host, '.' + host];
          for (var i = 0; i < hostParts.length - 1; i++) {
            var parentDomain = hostParts.slice(i).join('.');
            domains.push(parentDomain);
            domains.push('.' + parentDomain);
          }
          var paths = ['/', window.location.pathname];
          domains.forEach(function (d) {
            paths.forEach(function (p) {
              var domainAttr = d ? '; domain=' + d : '';
              document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=' + p + domainAttr;
              document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; Max-Age=0; path=' + p + domainAttr;
            });
          });
        }
      } catch (e) { }
